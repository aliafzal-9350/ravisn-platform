[program:fastapi-inbound-consumer]
process_name=%(program_name)s_%(process_num)02d
command=/var/www/ravisn-platform/apps/agent/.venv/bin/python -m src.workers.redis_consumer
directory=/var/www/ravisn-platform/apps/agent
autostart=true
autorestart=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/log/supervisor/fastapi-consumer.log
