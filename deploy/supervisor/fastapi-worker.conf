[program:fastapi-server]
command=/var/www/ravisn-platform/apps/agent/.venv/bin/uvicorn src.main:app --host 127.0.0.1 --port 8000 --workers 4
directory=/var/www/ravisn-platform/apps/agent
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/fastapi-server.log
