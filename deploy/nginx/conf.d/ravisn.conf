upstream laravel_core {
    server 127.0.0.1:9000; # PHP-FPM
}

upstream fastapi_agent {
    server 127.0.0.1:8000; # FastAPI Uvicorn ASGI cluster
}

server {
    listen 80;
    server_name platform.ravisn.com localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name platform.ravisn.com localhost;

    ssl_certificate /etc/letsencrypt/live/platform.ravisn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platform.ravisn.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/ravisn-platform/apps/core/public;
    index index.php index.html;
    client_max_body_size 50M;
    charset utf-8;

    # 1. FastAPI AI Agent Admin, Knowledge Base & Copilot APIs
    location ~ ^/(api/agent|api/v1/knowledge)/ {
        proxy_pass http://fastapi_agent;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 2. Meta Inbound Webhook Gateway (Fast Ingestion via Laravel)
    location = /api/v1/webhooks/meta {
        try_files $uri $uri/ /index.php?$query_string;
        proxy_read_timeout 10s;
    }

    # 3. Laravel Reverb WebSocket Server (Real-Time CRM Sync)
    location /app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # 4. Standard Laravel Application (Inertia SPA / CRM Dashboard / Static Assets)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
