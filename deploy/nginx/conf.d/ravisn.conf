# Websocket upgrade handling: only send "upgrade" when the client asked for it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream reverb_ws {
    server core-reverb:8080;
}

upstream laravel_core {
    server core:80;
}

# The FastAPI agent is deliberately NOT routed here. It is an internal service
# that only Laravel calls (authenticated with X-Internal-Token) over the docker
# network; exposing /api/agent, /api/knowledge or /docs would let anyone read or
# wipe knowledge bases and spend LLM credits.
#
# TLS: terminate HTTPS in front of this server (Cloudflare, Caddy, a load
# balancer) or add a `listen 443 ssl` server block with your certificates.
# See DEPLOYMENT.md.

server {
    listen 80;
    server_name localhost _;

    client_max_body_size 50M;
    server_tokens off;

    # Security headers (HSTS is ignored by browsers over plain HTTP, so it is
    # safe to send unconditionally and takes effect once TLS is in front).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 0. Laravel Reverb websockets (Echo/Pusher protocol) - the browser connects to
    #    ws(s)://<host>/app/<key>; TLS terminates in front of nginx in production.
    location /app/ {
        proxy_pass http://reverb_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 1. Laravel CRM, Inertia React SPA & Inbound Webhooks
    location / {
        proxy_pass http://laravel_core;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
