# Websocket upgrade handling: only send "upgrade" when the client asked for it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream reverb_ws {
    server core-reverb:8080;
}

upstream laravel_core {
    server core:80;
}

upstream fastapi_agent {
    server agent:8000;
}

server {
    listen 80;
    server_name localhost _;

    client_max_body_size 50M;

    # 0. Laravel Reverb websockets (Echo/Pusher protocol) - the browser connects to
    #    ws(s)://<host>/app/<key>; TLS terminates here in production (wss).
    location /app/ {
        proxy_pass http://reverb_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 1. FastAPI AI Agent APIs, Docs & Knowledge Base
    location ~ ^/(api/(v1/)?(agent|knowledge|health)|docs|redoc|openapi\.json)($|/) {
        proxy_pass http://fastapi_agent;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 2. Laravel CRM, Inertia React SPA & Inbound Webhooks
    location / {
        proxy_pass http://laravel_core;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}

