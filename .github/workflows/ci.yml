name: RAVISN CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laravel-tests:
    name: Laravel Core Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ravisn_db_test
          POSTGRES_USER: ravisn_user
          POSTGRES_PASSWORD: ravisn_secret_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, pgsql, redis, bcmath, zip
          coverage: none

      - name: Install Composer Dependencies
        working-directory: apps/core
        run: composer install --prefer-dist --no-interaction --optimize-autoloader

      - name: Run Laravel Migrations & Tests
        working-directory: apps/core
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: ravisn_db_test
          DB_USERNAME: ravisn_user
          DB_PASSWORD: ravisn_secret_password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          APP_KEY: base64:6k/lX94X3g+Qk8L7P3+e7s2M4a3g0t+qZ1xV7wB9yN8=
          APP_ENV: testing
        run: |
          php artisan test

  agent-tests:
    name: FastAPI & LangGraph Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        working-directory: apps/agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Pytest
        working-directory: apps/agent
        env:
          DATABASE_URL: postgresql+asyncpg://ravisn_user:ravisn_secret_password@localhost:5432/ravisn_db_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
        run: |
          pytest tests/ -v

  frontend-build:
    name: Inertia React & Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/core/package.json

      - name: Install Frontend Dependencies
        working-directory: apps/core
        run: npm ci

      - name: Compile Production Bundle
        working-directory: apps/core
        run: npm run build
