# ==============================================================================
# RAVISN Platform: Unified Reverse Proxy Gateway Configuration (Docker Compose)
# ==============================================================================

events {
    worker_connections 2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 100M;

    # Upstream Services
    upstream core_service {
        server core:80;
    }

    upstream agent_service {
        server agent:8000;
    }

    upstream qr_service {
        server whatsapp-qr-service:3001;
    }

    server {
        listen 80;
        server_name localhost _;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ----------------------------------------------------------------------
        # 1. FastAPI AI Agent Admin, Knowledge Base & Copilot APIs
        # ----------------------------------------------------------------------
        location ~ ^/(api/agent|api/v1/knowledge)/ {
            proxy_pass http://agent_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ----------------------------------------------------------------------
        # 2. Meta Inbound Webhook Gateway (Fast Ingestion via Laravel)
        # ----------------------------------------------------------------------
        location = /api/v1/webhooks/meta {
            proxy_pass http://core_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 10s;
        }

        # ----------------------------------------------------------------------
        # 3. WhatsApp QR Device Service (Node.js / Baileys)
        # ----------------------------------------------------------------------
        location /qr/ {
            rewrite ^/qr/(.*) /$1 break;
            proxy_pass http://qr_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------------------
        # 4. Laravel Core (Inertia React CRM / Outbound / Webhooks)
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://core_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
