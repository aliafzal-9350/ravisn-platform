[project]
name = "ravisn-agent"
version = "2.0.0"
description = "RAVISN Multi-Agent LangGraph Intelligence & RAG Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",
    "redis>=5.0.3",
    "httpx>=0.27.0",
    "langgraph>=0.0.30",
    "langchain-core>=0.1.30",
    "openai>=1.14.0",
    "groq>=0.5.0",
    "google-genai>=0.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
