# ==============================================================================
# RAVISN Platform: Unified Multi-Service Local & Production Orchestration
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Reverse Proxy Gateway (Nginx)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: ravisn-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always
    mem_limit: 150m
    depends_on:
      - core
      - agent
      - whatsapp-qr-service

  # ----------------------------------------------------------------------------
  # 2. Laravel Core (CRM Dashboard, Inertia React, Outbound Campaigns, Auth)
  # ----------------------------------------------------------------------------
  core:
    build:
      context: ./apps/core
      dockerfile: Dockerfile
    container_name: ravisn-core
    env_file: .env
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${POSTGRES_DB:-ravisn_platform}
      - DB_USERNAME=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-secure_postgres_pass}
      - REDIS_CLIENT=phpredis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - APP_URL=${APP_URL:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: always
    mem_limit: 800m

  # ----------------------------------------------------------------------------
  # 3. Laravel Queue Worker (Campaigns, Webhooks, Outbound Messages)
  # ----------------------------------------------------------------------------
  core-worker:
    build:
      context: ./apps/core
      dockerfile: Dockerfile
    container_name: ravisn-core-worker
    command: php artisan queue:work --queue=campaigns,webhooks,default --sleep=1 --tries=3 --max-time=3600
    env_file: .env
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${POSTGRES_DB:-ravisn_platform}
      - DB_USERNAME=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-secure_postgres_pass}
      - REDIS_CLIENT=phpredis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      core:
        condition: service_started
    restart: always
    mem_limit: 400m

  # ----------------------------------------------------------------------------
  # 4. FastAPI Agent (Multi-Agent AI, LangGraph, RAG/pgvector, Inbound Webhooks)
  # ----------------------------------------------------------------------------
  agent:
    build:
      context: ./apps/agent
      dockerfile: Dockerfile
    container_name: ravisn-agent
    command: sh -c "alembic upgrade head 2>/dev/null || true; uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-secure_postgres_pass}@postgres:5432/${POSTGRES_DB:-ravisn_platform}
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - XAI_API_KEY=${XAI_API_KEY}
      - XAI_MODEL=${XAI_MODEL:-grok-3-mini}
      - CALCOM_API_KEY=${CALCOM_API_KEY}
      - META_APP_SECRET=${META_APP_SECRET}
      - WHATSAPP_WEBHOOK_VERIFY_TOKEN=${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
      - META_WEBHOOK_VERIFY_TOKEN=${META_WEBHOOK_VERIFY_TOKEN}
      - WHATSAPP_QR_SERVICE_URL=${WHATSAPP_QR_SERVICE_URL:-http://whatsapp-qr-service:3001}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: always
    mem_limit: 800m

  # ----------------------------------------------------------------------------
  # 5. Celery Worker (Agent Async Tasks & Vector Indexing)
  # ----------------------------------------------------------------------------
  celery-worker:
    build:
      context: ./apps/agent
      dockerfile: Dockerfile
    container_name: ravisn-celery-worker
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-secure_postgres_pass}@postgres:5432/${POSTGRES_DB:-ravisn_platform}
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - XAI_API_KEY=${XAI_API_KEY}
      - XAI_MODEL=${XAI_MODEL:-grok-3-mini}
      - CALCOM_API_KEY=${CALCOM_API_KEY}
      - META_APP_SECRET=${META_APP_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    mem_limit: 500m

  # ----------------------------------------------------------------------------
  # 6. PostgreSQL Database with pgvector Extension
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ravisn-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secure_postgres_pass}
      - POSTGRES_DB=${POSTGRES_DB:-ravisn_platform}
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: >
      postgres -c shared_buffers=512MB
               -c effective_cache_size=1536MB
               -c work_mem=32MB
               -c max_connections=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    mem_limit: 1500m
    ports:
      - "5432:5432"

  # ----------------------------------------------------------------------------
  # 7. Redis Cache, Session & Queue Broker
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: ravisn-redis
    command: redis-server --maxmemory 350mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    mem_limit: 450m
    ports:
      - "6379:6379"

  # ----------------------------------------------------------------------------
  # 8. WhatsApp QR Socket Service (Node.js / Baileys)
  # ----------------------------------------------------------------------------
  whatsapp-qr-service:
    build:
      context: ./apps/whatsapp-qr-service
      dockerfile: Dockerfile
    container_name: ravisn-qr-service
    env_file: .env
    environment:
      - BACKEND_URL=http://agent:8000
      - PORT=3001
      - INTERNAL_SECRET=${WHATSAPP_QR_INTERNAL_SECRET:-dev-internal-secret}
    volumes:
      - qr_sessions:/app/sessions
    depends_on:
      - agent
    ports:
      - "3001:3001"
    restart: always
    mem_limit: 250m

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  qr_sessions:
    driver: local
